<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
   
</head>
<body>
    <section class="container__area">
      <article class="profile__area">
        <div class="img__box">
          <img src="./assets/images/avatar-jessica.jpeg" alt="profile__img">
        </div>
        <div class="content__area">
          <h2>Jessica Randall</h2>
          <h4>London, United Kingdom</h4>
        </div>
      </article>
      <article class="button__area">
        <p>"Front-end developer and avid reader."</p>
        <div class="btn__box">
          <button class="btn btn__1">GitHub</button>
          <button class="btn btn__2">Frontend Mentor</button>
          <button class="btn btn__3">LinkedIn</button>
          <button class="btn btn__4">Twitter</button>
          <button class="btn btn__5">Instagram</button>
        </div>
      </article>
    </section>
</body>
</html>
